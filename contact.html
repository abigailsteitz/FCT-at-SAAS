            <p style="text-align:center; margin-bottom: 28px;">

            </p>
            <form>
                <label for="name" style="font-weight:600;color:#7b5e3b;">Name</label>

                <label for="email" style="font-weight:600;color:#7b5e3b;">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@email.com">

                <label for="message" style="font-weight:600;color:#7b5e3b;">Message</label>
                <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>

                <button type="submit" style="margin-top:28px;">Send Message</button>
            </form>
            <div style="text-align:center;margin-top:32px;">
                Or email us at <a href="mailto:hello@driftwooddecor.com" style="color:#7b5e3b;text-decoration:underline;">hello@driftwooddecor.com</a>
