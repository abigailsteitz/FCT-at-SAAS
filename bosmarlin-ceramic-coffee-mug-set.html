<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bosmarlin Ceramic Coffee Mug Set of 4 | Driftwood Home Decor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="Websites/randomproject.html">
                    <img src="C:\Users\SAAS_User\Downloads\download.png" alt="Logo"/>
                </a>
                <a href="Websites/randomproject.html" style="text-decoration:none;">
                    <span class="nav-logo-text">Driftwood</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="Websites/randomproject.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="product-box">
            <img class="product-img" src="https://m.media-amazon.com/images/I/61MbbXesUxL._AC_UF1000,1000_QL80_.jpg" alt="Bosmarlin Ceramic Coffee Mug Set of 4"/>
            <div class="product-title">Bosmarlin Ceramic Coffee Mug Set of 4</div>
            <div class="product-price" id="price">$29.99</div>
            <div class="product-desc">
                Enjoy your favorite beverages in style with this set of four Bosmarlin ceramic coffee mugs. Durable, beautiful, and perfect for everyday use or gifting.
            </div>
            <div style="text-align:center;">
                <form id="addToCartForm" style="margin-bottom:18px;display:inline-block;">
                    <button type="submit" style="
                        background:#7b5e3b;
                        color:#fff;
                        border:none;
                        border-radius:24px;
                        padding:12px 32px;
                        font-size:1.1em;
                        font-weight:600;
                        cursor:pointer;
                    ">
                        Add to Cart
                    </button>
                </form>
                <div>
                    <a href="shop.html" style="color:#7b5e3b;text-decoration:underline;font-size:1em;display:inline-block;margin-top:8px;">&larr; Back to Store</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('addToCartForm').onsubmit = function(e) {
            e.preventDefault();
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const productId = 'bosmarlin-ceramic-coffee-mug-set';
            const price = 29.99;
            let found = false;
            for (let item of cart) {
                if (item.id === productId) {
                    item.qty += 1;
                    found = true;
                    break;
                }
            }
            if (!found) {
                cart.push({ id: productId, name: "Bosmarlin Ceramic Coffee Mug Set of 4", price: price, qty: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Added to cart!');
        };
    </script>
</body>
</html>
