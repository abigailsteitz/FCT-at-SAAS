<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sage Green Window Curtains | Driftwood Home Decor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="Websites/randomproject.html">
                    <img src="C:\Users\SAAS_User\Downloads\download.png" alt="Logo"/>
                </a>
                <span class="nav-logo-text">Driftwood</span>
            </div>
            <div class="nav-links">
                <a href="Websites/randomproject.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="product-box" style="text-align:center;">
            <img class="product-img" src="https://m.media-amazon.com/images/I/71dx4WSLSzL._AC_UF894,1000_QL80_.jpg" alt="Sage Green Window Curtains"/>
            <h1>Sage Green Window Curtains</h1>
            <div class="price">$44.99</div>
            <div class="desc">
                These elegant sage green curtains add a soft, natural touch to any room. Light-filtering and easy to hang, they're perfect for bedrooms, living rooms, or offices.
            </div>
            <form id="addToCartForm" style="margin-bottom:18px;display:inline-block;">
                <button type="submit" class="add-cart-btn">Add to Cart</button>
            </form>
            <div>
                <a href="shop.html" class="back-link">&larr; Back to Store</a>
            </div>
        </div>
    </div>
    <script>
document.getElementById('addToCartForm').onsubmit = function(e) {
    e.preventDefault();
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const productId = 'sage-green-window-curtains';
    const price = 44.99;
    let found = false;
    for (let item of cart) {
        if (item.id === productId) {
            item.qty += 1;
            found = true;
            break;
        }
    }
    if (!found) {
        cart.push({ id: productId, name: "Sage Green Window Curtains", price: price, qty: 1 });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert('Added to cart!');
};
</script>
</body>
</html>
