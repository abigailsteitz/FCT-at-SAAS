<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tree Bookshelf | Driftwood Home Decor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="Websites/randomproject.html">
                    <img src="C:\Users\SAAS_User\Downloads\download.png" alt="Logo"/>
                </a>
                <a href="Websites/randomproject.html" style="text-decoration:none;">
                    <span class="nav-logo-text">Driftwood</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="Websites/randomproject.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <img class="product-img" src="https://m.media-amazon.com/images/I/71pr1F0VWRL._AC_UF894,1000_QL80_.jpg" alt="Tree Bookshelf"/>
        <div class="product-title">Tree Bookshelf</div>
        <div class="product-price">$65.99</div>
        <div class="product-desc">
            Organize your books and decor with this unique tree-shaped bookshelf. Its sturdy design and natural wood finish make it a perfect fit for any modern or rustic home.
        </div>
        <div style="text-align:center;">
            <form id="addToCartForm" style="margin-bottom:18px;display:inline-block;">
                <button type="submit" style="
                    background:#7b5e3b;
                    color:#fff;
                    border:none;
                    border-radius:24px;
                    padding:12px 32px;
                    font-size:1.1em;
                    font-weight:600;
                    cursor:pointer;
                ">
                    Add to Cart
                </button>
            </form>
            <div>
                <a href="shop.html" style="color:#7b5e3b;text-decoration:underline;font-size:1em;display:inline-block;margin-top:8px;">&larr; Back to Store</a>
            </div>
        </div>
    </div>
    <script>
document.getElementById('addToCartForm').onsubmit = function(e) {
    e.preventDefault();
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const productId = 'tree-bookshelf';
    const price = 65.99;
    let found = false;
    for (let item of cart) {
        if (item.id === productId) {
            item.qty += 1;
            found = true;
            break;
        }
    }
    if (!found) {
        cart.push({ id: productId, name: "Tree Bookshelf", price: price, qty: 1 });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert('Added to cart!');
};
    </script>
</body>
</html>
