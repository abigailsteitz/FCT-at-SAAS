<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tree Bookshelf | Driftwood Home Decor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #abbd90; color: #3a3a3a; margin: 0; padding: 32px 0; }
        .top-nav { width: 100%; background: #dfd8cb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; min-height: 90px; }
        .nav-content { width: 100%; max-width: 1100px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 90px; }
        .nav-logo { display: flex; align-items: center; margin-right: 32px; }
        .nav-logo img { height: 54px; width: auto; border-radius: 8px; display: block; }
        .nav-logo-text { font-size: 2em; font-weight: 600; color: #7b5e3b; margin-left: 12px; letter-spacing: 1px; font-family: 'Segoe UI', Arial, sans-serif; text-decoration: none; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: #7b5e3b; font-weight: 500; font-size: 1.3em; transition: color 0.2s; padding: 8px 0; }
        .nav-links a:hover { color: #3a3a3a; }
        .container { max-width: 700px; margin: 60px auto; background: #dfd8cb; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.09); padding: 36px 32px; }
        .product-img { width: 100%; max-width: 340px; height: auto; border-radius: 12px; display: block; margin: 0 auto 24px auto; }
        .product-title { font-size: 2em; color: #7b5e3b; font-weight: 600; margin-bottom: 12px; text-align: center; }
        .product-price { color: #3a3a3a; font-size: 1.3em; font-weight: 500; text-align: center; margin-bottom: 18px; }
        .product-desc { font-size: 1.1em; line-height: 1.6; text-align: center; }
        button { 
            background-color: #7b5e3b; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 12px 24px; 
            font-size: 1.2em; 
            cursor: pointer; 
            display: block; 
            margin: 0 auto; 
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #6a4e3a;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="Websites/randomproject.html">
                    <img src="C:\Users\SAAS_User\Downloads\download.png" alt="Logo"/>
                </a>
                <a href="Websites/randomproject.html" style="text-decoration:none;">
                    <span class="nav-logo-text">Driftwood</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="Websites/randomproject.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <img class="product-img" src="https://m.media-amazon.com/images/I/71pr1F0VWRL._AC_UF894,1000_QL80_.jpg" alt="Tree Bookshelf"/>
        <div class="product-title">Tree Bookshelf</div>
        <div class="product-price">$65.99</div>
        <div class="product-desc">
            Organize your books and decor with this unique tree-shaped bookshelf. Its sturdy design and natural wood finish make it a perfect fit for any modern or rustic home.
        </div>
        <button id="addToCartBtn" style="
            display: block;
            margin: 36px auto 0 auto;
            background: #abbd90;
            color: #7b5e3b;
            border: 2px solid #7b5e3b;
            border-radius: 8px;
            padding: 14px 36px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        ">Add to Cart</button>
    </div>
    <script>
        document.getElementById('addToCartBtn').onclick = function() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const productId = 'tree-bookshelf';
            const price = 65.99;
            let found = false;
            for (let item of cart) {
                if (item.id === productId) {
                    item.qty += 1;
                    found = true;
                    break;
                }
            }
            if (!found) {
                cart.push({ id: productId, name: "Tree Bookshelf", price: price, qty: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Added to cart!');
        };
    </script>
</body>
</html>
