<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Your Driftwood Decor Match!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f5f2; color: #3a5a6b; margin: 0; }
        .quiz-container {
            max-width: 480px;
            margin: 48px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 32px 28px;
        }
        h1 { text-align: center; margin-bottom: 18px; }
        .question { margin: 24px 0 12px 0; font-weight: 600; }
        .answers label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding-left: 4px;
        }
        button {
            background: #7b5e3b;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 22px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.2s;
        }
        button:hover { background: #5d472a; }
        .result {
            margin-top: 32px;
            padding: 18px;
            background: #e3eaf1;
            border-radius: 12px;
            text-align: center;
        }
        .result img {
            margin-top: 12px;
            max-width: 180px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>What Driftwood Decor Item Should You Buy?</h1>
        <a href="randomproject.html" style="display:inline-block;margin-bottom:18px;">
            <button type="button" style="
                background: #e3eaf1;
                color: #3a5a6b;
                border: none;
                border-radius: 18px;
                padding: 8px 20px;
                font-size: 1em;
                font-weight: 600;
                cursor: pointer;
                margin-bottom: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.07);
                transition: background 0.2s;
            ">Back to Home</button>
        </a>
        <form id="quizForm">
            <div class="question">1. What's your ideal weekend?</div>
            <div class="answers">
                <label><input type="radio" name="q1" value="relax" required> Cozying up with a book or movie</label>
                <label><input type="radio" name="q1" value="nature"> Exploring outdoors or gardening</label>
                <label><input type="radio" name="q1" value="host"> Hosting friends or family</label>
                <label><input type="radio" name="q1" value="creative"> Doing something crafty or creative</label>
            </div>
            <div class="question">2. Which color palette speaks to you?</div>
            <div class="answers">
                <label><input type="radio" name="q2" value="relax" required> Soft neutrals & calming blues</label>
                <label><input type="radio" name="q2" value="nature"> Greens & earthy browns</label>
                <label><input type="radio" name="q2" value="host"> Warm golds & terracotta</label>
                <label><input type="radio" name="q2" value="creative"> Pops of color & playful patterns</label>
            </div>
            <div class="question">3. Pick a home vibe:</div>
            <div class="answers">
                <label><input type="radio" name="q3" value="relax" required> Calm & restful retreat</label>
                <label><input type="radio" name="q3" value="nature"> Natural & organic</label>
                <label><input type="radio" name="q3" value="host"> Welcoming & lively</label>
                <label><input type="radio" name="q3" value="creative"> Artistic & unique</label>
            </div>
            <!-- New Question 4 -->
            <div class="question">4. Which activity sounds most appealing?</div>
            <div class="answers">
                <label><input type="radio" name="q4" value="relax" required> Taking a relaxing bath</label>
                <label><input type="radio" name="q4" value="nature"> Going for a hike</label>
                <label><input type="radio" name="q4" value="host"> Cooking a meal for friends</label>
                <label><input type="radio" name="q4" value="creative"> Rearranging or decorating a room</label>
            </div>
            <!-- New Question 5 -->
            <div class="question">5. What is your favorite type of decor?</div>
            <div class="answers">
                <label><input type="radio" name="q5" value="relax" required> Soft blankets and pillows</label>
                <label><input type="radio" name="q5" value="nature"> Plants and natural wood</label>
                <label><input type="radio" name="q5" value="host"> Stylish dinnerware and mugs</label>
                <label><input type="radio" name="q5" value="creative"> Unique shelves and art pieces</label>
            </div>
            <button type="submit">See My Result</button>
        </form>
        <div class="result" id="quizResult" style="display:none;"></div>
    </div>
    <script>
        const results = {
            relax: {
                title: "You need a Cozy Throw Pillow!",
                desc: "You love comfort and relaxation. Our soft, earth-toned throw pillows will make your space extra inviting.",
                img: "https://cdn-images.article.com/products/SKU23589/2890x1500/image149309.jpg?w=320&q=80&fit=max",
                link: "throwpillow.html"
            },
            nature: {
                title: "You need a Green Timberline Candle!",
                desc: "Nature inspires you. Our Green Timberline Candle brings the outdoors in with a fresh, calming scent and a beautiful natural look.",
                img: "https://cdn.shoplightspeed.com/shops/628145/files/40851698/hyoola-green-timberline-wood-pillar-candle-2-sizes.jpg",
                link: "candle.html"
            },
            host: {
                title: "You need a Bosmarlin Ceramic Coffee Mug Set!",
                desc: "You love to host and connect. Our Bosmarlin ceramic mug set is perfect for sharing coffee or tea with friends in style.",
                img: "https://m.media-amazon.com/images/I/61MbbXesUxL._AC_UF1000,1000_QL80_.jpg",
                link: "mug.html"
            },
            creative: {
                title: "You need a Tree Bookshelf!",
                desc: "You’re creative and bold. Our tree bookshelf is perfect for displaying your favorite books and art in a unique way.",
                img: "https://m.media-amazon.com/images/I/71pr1F0VWRL._AC_UF894,1000_QL80_.jpg",
                link: "shelf.html"
            },
            bamboo_comforter: {
                title: "You need Bamboo Comforters!",
                desc: "Experience ultimate comfort and eco-friendly luxury with our bamboo comforters, perfect for a restful night's sleep.",
                img: "https://m.media-amazon.com/images/I/81kYqwqRK5L.jpg",
                link: "bamboo-comforter.html"
            },
            avocado_lamp: {
                title: "You need a Linen Avocado Lamp!",
                desc: "Brighten your space with a linen avocado lamp, blending playful design and soft green hues for a cozy vibe.",
                img: "https://i.etsystatic.com/13498126/r/il/f51e55/5960004560/il_570xN.5960004560_ogkm.jpg",
                link: "avocado-lamp.html"
            },
            green_ottoman: {
                title: "You need a Green Storage Ottoman!",
                desc: "Add style and function to your room with a green storage ottoman—perfect for extra seating and hidden storage.",
                img: "https://m.media-amazon.com/images/I/91Akw8ptmmL.jpg",
                link: "green-ottoman.html"
            },
            wicker_chair: {
                title: "You need a Modern Wicker Chair!",
                desc: "Relax in style with a modern wicker chair, bringing natural textures and a fresh look to your home.",
                img: "https://m.media-amazon.com/images/I/A1RVH9JfMwL._AC_UF894,1000_QL80_.jpg",
                link: "wicker-chair.html"
            },
            sage_curtains: {
                title: "You need Sage Green Window Curtains!",
                desc: "Soften your space and add a touch of color with our sage green window curtains, perfect for any room.",
                img: "https://m.media-amazon.com/images/I/71dx4WSLSzL._AC_UF894,1000_QL80_.jpg",
                link: "sage-curtains.html"
            },
            sage_clock: {
                title: "You need a Sage Green Clock!",
                desc: "Keep time in style with a sage green clock, a subtle and elegant accent for your wall.",
                img: "https://i.etsystatic.com/41004641/r/il/868b69/5115136397/il_fullxfull.5115136397_gmsc.jpg",
                link: "sage-clock.html"
            },
            vineyard_side_table: {
                title: "You need a Sage Green Vineyard Side Table!",
                desc: "Bring vineyard charm to your home with this sage green side table, perfect for your favorite book or drink.",
                img: "https://linqcdn.avbportal.com/images/9465fc29-5233-4f83-b54a-8a98e3d57848.jpg?w=160",
                link: "vineyard-side-table.html"
            },
            watercolor_painting: {
                title: "You need a Green Watercolor Abstract Wall Painting!",
                desc: "Add a splash of art to your walls with a green watercolor abstract painting, bringing calm and creativity to your space.",
                img: "https://papermoonartdesign.com/cdn/shop/products/WA232-watercolor-abstract-nature-botanical-green-aesthetic-printable-wall-art-03.jpg?v=1622491445&width=1445",
                link: "watercolor-painting.html"
            },
            vineyard_coffee_table: {
                title: "You need a Sage Green Vineyard Coffee Table!",
                desc: "Complete your living room with a sage green vineyard coffee table, blending rustic charm and modern style.",
                img: "https://linqcdn.avbportal.com/images/3e893a30-252f-4a24-9a8c-f2ebe91ef076.jpg?w=640",
                link: "vineyard-coffee-table.html"
            }
        };

        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Count answers
            const form = e.target;
            const counts = {relax:0, nature:0, host:0, creative:0};
            // Update to count 5 questions
            for (let i = 1; i <= 5; i++) {
                const val = form['q'+i].value;
                counts[val]++;
            }
            // Find max
            let maxKey = 'relax';
            let maxVal = 0;
            for (const key in counts) {
                if (counts[key] > maxVal) {
                    maxKey = key;
                    maxVal = counts[key];
                }
            }
            // Show result
            const r = results[maxKey];
            const resultDiv = document.getElementById('quizResult');
            resultDiv.innerHTML = `
                <h2>${r.title}</h2>
                <p>${r.desc}</p>
                <img src="${r.img}" alt="Recommended product">
                <br>
                <a href="../shop.html" style="display:inline-block;margin-top:10px;color:#7b5e3b;text-decoration:underline;font-weight:600;">Shop Now</a>
            `;
            resultDiv.style.display = 'block';
            form.style.display = 'none';    
        });
    </script>
</body>
</html>
