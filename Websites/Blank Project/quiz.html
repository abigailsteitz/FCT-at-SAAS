<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <title>Find Your FinFriend – Quiz</title>
  <link rel="stylesheet" href="main.css">
  <script defer src="quiz.js"></script>
</head>
<body>
  <h1>Which FinFriend Is Your Match?</h1>
  <p>Answer the questions to discover your aquatic soulmate 🐠</p>

  <form id="quizForm">
    <div>
      <p>1. What’s your ideal weekend?</p>
      <label><input type="radio" name="q1" value="shark"> Extreme adventure</label><br>
      <label><input type="radio" name="q1" value="puffer"> Relaxing and watching TV</label><br>
      <label><input type="radio" name="q1" value="sailfish"> Going out dancing</label>
    </div>

    <div>
      <p>2. Pick a snack:</p>
      <label><input type="radio" name="q2" value="shark"> Beef jerky</label><br>
      <label><input type="radio" name="q2" value="puffer"> Popcorn</label><br>
      <label><input type="radio" name="q2" value="sailfish"> Sushi</label>
    </div>

    <div>
      <p>3. Your friends describe you as:</p>
      <label><input type="radio" name="q3" value="shark"> Energetic</label><br>
      <label><input type="radio" name="q3" value="puffer"> Easygoing</label><br>
      <label><input type="radio" name="q3" value="sailfish"> Stylish</label>
    </div>

    <div>
      <p>4. What’s your dream vacation?</p>
      <label><input type="radio" name="q4" value="shark"> Surfing in Hawaii</label><br>
      <label><input type="radio" name="q4" value="puffer"> Cabin by the lake</label><br>
      <label><input type="radio" name="q4" value="sailfish"> Cruise through the Mediterranean</label>
    </div>

    <div>
      <p>5. Choose a hobby:</p>
      <label><input type="radio" name="q5" value="shark"> Rock climbing</label><br>
      <label><input type="radio" name="q5" value="puffer"> Drawing</label><br>
      <label><input type="radio" name="q5" value="sailfish"> Fashion design</label>
    </div>

    <button type="submit">See My FinFriend!</button>
  </form>

  <div id="result" style="margin-top: 30px; text-align: center;"></div>

  <p><a href="index.html">← Back to Home</a></p>
</body>
</html>
