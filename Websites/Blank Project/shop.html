<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Alice's Jewelry</title>
</head>
<body>
    <header>
        <h1>Alice's Jewelry</h1>
        <p>Exquisite handcrafted jewelry for every occasion</p>
    </header>
    <nav>
        <a href="buisnessproject.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main>
        <section id="shop">
            <h2>Shop</h2>
            <div class="shop-options">
                <div>
                    <img src="https://www.lunaskye.com/cdn/shop/products/My_Moon_My_Stars.jpg?v=1629830248&width=1946" alt="Shoot For The Sky Necklace">
                    <h3>Shoot For The Sky Necklace</h3>
                    <p>$49.99</p>
                    <button class="add-to-cart" data-name="Shoot For The Sky Necklace" data-price="49.99">
                        Add to Cart
                    </button>
                </div>
                <div>
                    <img src="https://res.cloudinary.com/kendra-scott/image/upload/q_auto,f_auto,dpr_auto/w_800,c_fit/Catalogs/kendrascott/jewelry/chase/2020-ari-chase/ari-delicate-bracelet/kendra-scott-ari-heart-delicate-chain-bracelet-gold-dichroic-glass-00-lg.jpg" alt="Heart Pendant Bracelet">
                    <h3>Heart Pendant Bracelet</h3>
                    <p>$29.99</p>
                    <button class="add-to-cart" data-name="Heart pendant Bracelet" data-price="29.99">
                        Add to Cart
                    </button>
                </div>
                <div>
                    <img src="https://cdn.shopify.com/s/files/1/2579/7674/files/Ana-Luisa-Jewelry-Rings-Gold-Twist-Ring-Rope-Bold-Gold-new1.jpg?v=1700556033" alt="Golden Twist Ring">
                    <h3>Golden Twist Ring</h3>
                    <p>$19.99</p>
                    <button class="add-to-cart" data-name="Golden Twist Ring" data-price="19.99">
                        Add to Cart
                    </button>
                </div>
            </div>
        </section>
        <section id="cart">
            <h2>Your Bag</h2>
            <ul id="cart-items"></ul>
            <p id="cart-total">Total: $0.00</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Alice's Jewelry. All rights reserved.</p>
    </footer>
    <script>
const cart = [];
const cartItems = document.getElementById('cart-items');
const cartTotal = document.getElementById('cart-total');

function updateCart() {
    cartItems.innerHTML = '';
    let total = 0;
    cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price.toFixed(2)} (x${item.qty})`;
        cartItems.appendChild(li);
        total += item.price * item.qty;
    });
    cartTotal.textContent = `Total: $${total.toFixed(2)}`;
}

document.querySelectorAll('.add-to-cart').forEach(btn => {
    btn.addEventListener('click', function() {
        const name = this.getAttribute('data-name');
        const price = parseFloat(this.getAttribute('data-price'));
        const existing = cart.find(item => item.name === name);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCart();
    });
});
    </script>
</body>
</html>
