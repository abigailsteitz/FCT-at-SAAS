<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Match Quiz - Unique Pets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="main.css" />
  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #fceabb 0%, #f8b500 100%);
      margin: 0;
      padding: 0;
      color: #3a2c1a;
      min-height: 100vh;
      position: relative;
    }
    header {
      background: linear-gradient(90deg, #ffb347 0%, #ffcc33 100%);
      color: #fff;
      padding: 48px 0 24px 0;
      text-align: center;
      box-shadow: 0 4px 24px rgba(255, 179, 71, 0.15);
      border-bottom-left-radius: 60px 40px;
      border-bottom-right-radius: 60px 40px;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }
    header h1 {
      font-size: 2.5em;
      margin: 0;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      letter-spacing: 4px;
      text-shadow: 2px 2px 12px #ffb34755;
      animation: pop 1s;
      font-weight: 800;
      background: linear-gradient(90deg, #ff512f 0%, #dd2476 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    header::after {
      content: "❓";
      font-size: 2.5em;
      position: absolute;
      right: 40px;
      top: 30px;
      opacity: 0.18;
      transform: rotate(-15deg);
      pointer-events: none;
    }
    header::before {
      content: "🐾";
      font-size: 2em;
      position: absolute;
      left: 40px;
      top: 60px;
      opacity: 0.13;
      transform: rotate(10deg);
      pointer-events: none;
    }
    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 36px 0 0 0;
      background: none;
      gap: 32px;
    }
    nav ul li a {
      color: #fff;
      background: linear-gradient(90deg, #ff6e7f 0%, #bfe9ff 100%);
      text-decoration: none;
      font-weight: bold;
      padding: 16px 36px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(255, 110, 127, 0.10);
      transition: background 0.2s, color 0.2s, transform 0.2s;
      font-size: 1.15em;
      letter-spacing: 1.5px;
      border: 2px solid #fff3;
      position: relative;
      overflow: hidden;
      outline: none;
    }
    nav ul li a:hover, nav ul li a:focus {
      background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%);
      color: #fff;
      transform: scale(1.08) rotate(-2deg);
      border: 2px solid #ffb347;
      box-shadow: 0 6px 24px rgba(255, 179, 71, 0.18);
      text-shadow: 0 2px 8px #fff7;
    }
    #quiz-content {
      max-width: 800px;
      margin: 60px auto 0 auto;
      background: #fffbe9;
      border-radius: 32px;
      box-shadow: 0 8px 32px rgba(255, 179, 71, 0.13);
      padding: 48px 40px;
      text-align: center;
      border: 4px dashed #ffb347;
      animation: fadein 1.2s;
      position: relative;
    }
    @keyframes fadein {
      0% { opacity: 0; transform: translateY(30px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    h2 {
      color: #ff6e7f;
      margin-top: 1.2em;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      font-weight: 700;
    }
    .result {
      font-size: 1.3em;
      margin-top: 30px;
      color: #36d1c4;
      font-weight: bold;
    }
    .result a {
      color: #fff;
      background: linear-gradient(90deg, #36d1c4 0%, #5b86e5 100%);
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      margin-left: 10px;
      transition: background 0.2s;
      display: inline-block;
    }
    .result a:hover {
      background: linear-gradient(90deg, #ff512f 0%, #dd2476 100%);
    }
    label {
      display: block;
      margin: 18px 0 8px 0;
      font-size: 1.1em;
      color: #222;
    }
    input[type="radio"] {
      margin-right: 8px;
    }
    button {
      margin-top: 30px;
      background: linear-gradient(90deg, #ff512f 0%, #dd2476 100%);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 14px 36px;
      font-size: 1.1em;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(255, 81, 47, 0.12);
    }
    button:hover {
      background: linear-gradient(90deg, #36d1c4 0%, #5b86e5 100%);
      transform: scale(1.05);
    }
    @media (max-width: 900px) {
      #quiz-content {
        padding: 24px 8px;
      }
      nav ul {
        flex-direction: column;
        gap: 16px;
      }
      nav ul li {
        margin: 0;
      }
      header {
        padding: 28px 0 10px 0;
      }
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 2em;
      }
      #quiz-content {
        padding: 14px 4vw;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Pet Match Quiz</h1>
  </header>
  <nav>
    <ul>
      <li><a href="./index.html">Home</a></li>
      <li><a href="./chameleon.html">Chameleons</a></li>
      <li><a href="./tibetanmastiff.html">Tibetan Mastiff</a></li>
      <li><a href="./victoriacrownedpidgeon.html">Victoria Crowned Pigeon</a></li>
    </ul>
  </nav>
  <div id="quiz-content">
    <h2>Are you having trouble deciding which pet is the best fit? Take this quiz to help you decide!</h2>
    <form id="petQuiz">
      <label>Do you enjoy exercise / do you exercise often?</label>
      <input type="radio" name="q1" value="yes" required> Yes
      <input type="radio" name="q1" value="no"> No

      <label>Do you have lots of space for a pet?</label>
      <input type="radio" name="q2" value="yes" required> Yes
      <input type="radio" name="q2" value="no"> No

      <label>Would you want your own space away from a pet?</label>
      <input type="radio" name="q3" value="yes" required> Yes
      <input type="radio" name="q3" value="no"> No

      <label>Do you live in a warm place?</label>
      <input type="radio" name="q4" value="yes" required> Yes
      <input type="radio" name="q4" value="no"> No

      <label>Finally, do you prefer mammals to reptiles?</label>
      <input type="radio" name="q5" value="yes" required> Yes
      <input type="radio" name="q5" value="no"> No

      <br>
      <button type="submit">Reveal My Perfect Pet!</button>
    </form>
    <div class="result" id="quizResult"></div>
  </div>
  <script>
    document.getElementById('petQuiz').onsubmit = function(event) {
      event.preventDefault();
      let score = 0;
      const form = event.target;
      if(form.q1.value === "yes") score++;
      if(form.q2.value === "yes") score++;
      if(form.q3.value === "no") score++;
      if(form.q4.value === "no") score++;
      if(form.q5.value === "yes") score++;

      let resultDiv = document.getElementById('quizResult');
      if(score >= 4) {
        resultDiv.innerHTML = 'You should adopt a Tibetan Mastiff! <a href="tibetanmastiff.html">Click here for more information</a>';
      } else if(score >= 2) {
        resultDiv.innerHTML = 'You should adopt a Victoria Crowned Pigeon! <a href="victoriacrownedpidgeon.html">Click here for more information</a>';
      } else {
        resultDiv.innerHTML = 'You should adopt a Chameleon! <a href="chameleon.html">Click here for more information</a>';
      }
    }
  </script>
</body>
</html>
