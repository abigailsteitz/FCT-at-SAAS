<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header>
    <h1>Pet Match Quiz</h1>
  </header>
  <nav>
    <ul>
      <li><a href="./index.html">Home</a></li>
      <li><a href="./chameleon.html">Chameleons</a></li>
      <li><a href="./tibetanmastiff.html">Tibetan Mastiff</a></li>
      <li><a href="./victoriacrownedpidgeon.html">Victoria Crowned Pigeon</a></li>
    </ul>
  </nav>
  <div id="quiz-content">
    <h2>Are you having trouble deciding which pet is the best fit? Take this quiz to help you decide!</h2>
    <form id="petQuiz">
      <label>Do you enjoy exercise / do you exercise often?</label>
      <input type="radio" name="q1" value="yes" required> Yes
      <input type="radio" name="q1" value="no"> No

      <label>Do you have lots of space for a pet?</label>
      <input type="radio" name="q2" value="yes" required> Yes
      <input type="radio" name="q2" value="no"> No

      <label>Would you want your own space away from a pet?</label>
      <input type="radio" name="q3" value="yes" required> Yes
      <input type="radio" name="q3" value="no"> No

      <label>Do you live in a warm place?</label>
      <input type="radio" name="q4" value="yes" required> Yes
      <input type="radio" name="q4" value="no"> No

      <label>Finally, do you prefer mammals to reptiles?</label>
      <input type="radio" name="q5" value="yes" required> Yes
      <input type="radio" name="q5" value="no"> No

      <br>
      <button type="submit">Reveal My Perfect Pet!</button>
    </form>
    <div class="result" id="quizResult"></div>
  </div>
  <script>
    document.getElementById('petQuiz').onsubmit = function(event) {
      event.preventDefault();
      let score = 0;
      const form = event.target;
      if(form.q1.value === "yes") score++;
      if(form.q2.value === "yes") score++;
      if(form.q3.value === "no") score++;
      if(form.q4.value === "no") score++;
      if(form.q5.value === "yes") score++;

      let resultDiv = document.getElementById('quizResult');
      if(score >= 4) {
        resultDiv.innerHTML = 'You should adopt a Tibetan Mastiff! <a href="tibetanmastiff.html">Click here for more information</a>';
      } else if(score >= 2) {
        resultDiv.innerHTML = 'You should adopt a Victoria Crowned Pigeon! <a href="victoriacrownedpidgeon.html">Click here for more information</a>';
      } else {
        resultDiv.innerHTML = 'You should adopt a Chameleon! <a href="chameleon.html">Click here for more information</a>';
      }
    }
  </script>
</body>

</html>
