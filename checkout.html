<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Driftwood Home Decor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #abbd90; color: #3a3a3a; margin: 0; padding: 32px 0; }
        .top-nav { width: 100%; background: #dfd8cb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; min-height: 90px; }
        .nav-content { width: 100%; max-width: 1100px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 90px; }
        .nav-logo { display: flex; align-items: center; margin-right: 32px; }
        .nav-logo img { height: 54px; width: auto; border-radius: 8px; display: block; }
        .nav-logo-text { font-size: 2em; font-weight: 600; color: #7b5e3b; margin-left: 12px; letter-spacing: 1px; font-family: 'Segoe UI', Arial, sans-serif; text-decoration: none; }
        .nav-links { display: flex; gap: 28px; }
        .nav-links a { text-decoration: none; color: #7b5e3b; font-weight: 500; font-size: 1.3em; transition: color 0.2s; padding: 8px 0; }
        .nav-links a:hover { color: #3a3a3a; }
        .container { max-width: 700px; margin: 60px auto; background: #dfd8cb; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.09); padding: 36px 32px; }
        h1 { font-size: 2.2em; color: #7b5e3b; margin-bottom: 24px; text-align: center; }
        .checkout-form {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 24px;
            max-width: 650px; /* increased width */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center; /* center form content */
        }
        .checkout-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #7b5e3b;
            text-align: center; /* center label text */
        }
        .checkout-form input, .checkout-form textarea {
            width: 80%; /* narrower, but centered */
            margin-left: auto;
            margin-right: auto;
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1c3a3;
            margin-bottom: 18px;
            font-size: 1em;
            background: #f9f9f6;
            text-align: center; /* center input text */
        }
        .checkout-form textarea { resize: vertical; min-height: 60px; }
        .checkout-btn {
            display: block;
            margin: 0 auto;
            background: #abbd90;
            color: #7b5e3b;
            border: 2px solid #7b5e3b;
            border-radius: 8px;
            padding: 14px 36px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .checkout-btn:hover { background: #d1c3a3; }
        .order-summary { margin-bottom: 32px; }
        .order-summary ul { list-style: none; padding: 0; }
        .order-summary li { margin-bottom: 12px; }
        .order-total { font-weight: 600; font-size: 1.1em; margin-top: 12px; }
        .success-message { text-align: center; color: #2d7a3e; font-size: 1.2em; margin-top: 32px; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-logo">
                <a href="Websites/randomproject.html">
                    <img src="C:\Users\SAAS_User\Downloads\download.png" alt="Logo"/>
                </a>
                <a href="Websites/randomproject.html" style="text-decoration:none;">
                    <span class="nav-logo-text">Driftwood</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="Websites/randomproject.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1>Checkout</h1>
        <div class="order-summary" id="orderSummary"></div>
        <form class="checkout-form" id="checkoutForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
            <label for="address">Shipping Address</label>
            <textarea id="address" required></textarea>
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <button class="checkout-btn" type="submit">Place Order</button>
        </form>
        <div class="success-message" id="successMsg" style="display:none;">
            Thank you for your order! You will receive a confirmation email soon.
        </div>
    </div>
    <script>
        // Render order summary from cart
        function renderOrderSummary() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const orderSummary = document.getElementById('orderSummary');
            if (cart.length === 0) {
                orderSummary.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
                document.getElementById('checkoutForm').style.display = 'none';
                return;
            }
            let html = '<ul>';
            let total = 0;
            for (let item of cart) {
                html += `<li><span style="font-weight:600;">${item.name}</span> &times; ${item.qty} <span style="float:right;">$${(item.price * item.qty).toFixed(2)}</span></li>`;
                total += item.price * item.qty;
            }
            html += '</ul>';
            html += `<div class="order-total">Total: $${total.toFixed(2)}</div>`;
            orderSummary.innerHTML = html;
        }
        renderOrderSummary();

        // Handle checkout form
        document.getElementById('checkoutForm').onsubmit = function(e) {
            e.preventDefault();
            // In a real app, send order to server here
            localStorage.removeItem('cart');
            document.getElementById('checkoutForm').style.display = 'none';
            document.getElementById('orderSummary').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        };
    </script>
</body>
</html>
